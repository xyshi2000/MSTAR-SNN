# Template basic recipe adapted to the existing sparse model.
# SEW ResNet uses the MS ResNet18 recipe; CIFAR100 uses the CIFAR10 recipe.
model: sew_resnet18_cifar
dataset: CIFAR10
data_path: ./datasets
batch_size: 256
workers: 16
augment: true

seed: 12450
T: 4
epoch_search: 280
epoch_finetune: 40
search_lr: 0.1
finetune_lr: 0.001
search_lr_scheduler: [Cosine]
finetune_lr_scheduler: [Cosine]
optimizer: SGD
nesterov: false
weight_decay: 0.0002
accumulate_step: 1
amp: true
TET: false
TET_phi: 1.0
TET_lambda: 0.0

# Null pruning optimizer/LR inherit the search values.
not_prune_neuron: false
prune_optimizer: null
prune_lr: null
prune_weight_decay: 0.0
mask_init_factor: [0, 0]
penalty_lmbda: 1.0e-7
# Two endpoints span the entire search phase (280 epochs).
temp_scheduler: [5, 1000]

output_dir: ./logs/sew_resnet18_cifar10
resume: null
resume_type: test
save_latest: false
test_only: false
print_freq: 5
tb_interval: 10
distributed_init_mode: env://
sync_bn: false
cache_dataset: false
zero_init_residual: false
