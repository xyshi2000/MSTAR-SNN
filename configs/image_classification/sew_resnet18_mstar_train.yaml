# Dense SEW training with the MSTAR baseline data/optimizer recipe.
model: sew_resnet18
dataset: MSTAR
data_path: ./datasets/MSTAR/soc
output_dir: ./logs/sew_resnet18_mstar_train
seed: 0
T: 4
batch_size: 64
workers: 4
augment: true
epoch_search: 100
epoch_finetune: 0
optimizer: AdamW
search_lr: 0.001
finetune_lr: 0.001
weight_decay: 0.0001
search_lr_scheduler: [Cosine]
finetune_lr_scheduler: [Cosine]
amp: true
TET: false
not_prune_neuron: true
eval_final_only: true
save_latest: true
